# GamFix all-in-one stack: web (landing + citizen app + dashboard),
# PocketBase backend (hooks + migrations included), GOWA WhatsApp gateway.
#
#   1) cp .env.example .env      then edit GOWA_USER / GOWA_PASS
#   2) docker compose up -d --build
#   3) create the admin account:
#      docker compose exec pocketbase /pb/pocketbase superuser create \
#        you@example.com 'StrongPassword!' --dir=/pb/pb_data
#   4) link WhatsApp: open http://<host>:<GOWA_PORT> and scan the QR
#
# TLS: put this behind your reverse proxy / Cloudflare; the web container
# serves plain HTTP on WEB_PORT.
name: gamfix

services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - pocketbase
    restart: unless-stopped

  pocketbase:
    build:
      context: ../..
      dockerfile: infra/docker/pocketbase.Dockerfile
    environment:
      GOWA_BASE_URL: http://gowa:3000
      GOWA_BASIC_AUTH: ${GOWA_USER:-gowa}:${GOWA_PASS:?set GOWA_PASS in .env}
      GOWA_DEVICE_ID: ${GOWA_DEVICE_ID:-}
    volumes:
      - pb_data:/pb/pb_data
    expose:
      - "8090"
    restart: unless-stopped

  gowa:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    command: ["rest"]
    environment:
      APP_BASIC_AUTH: ${GOWA_USER:-gowa}:${GOWA_PASS:?set GOWA_PASS in .env}
      APP_PORT: 3000
      APP_DEBUG: "false"
      APP_OS: Chrome
      WHATSAPP_ACCOUNT_VALIDATION: "false"
    volumes:
      - gowa_statics:/app/statics
      - gowa_storages:/app/storages
    expose:
      - "3000"
    # Bound to localhost only — reach the QR page through an SSH tunnel:
    #   ssh -L 3001:127.0.0.1:3001 user@vps
    ports:
      - "127.0.0.1:${GOWA_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  pb_data:
  gowa_statics:
  gowa_storages:
