# nginx config for the GamFix all-in-one Docker stack.
# Mirrors the production VPS layout; TLS terminates in front of this container.
server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # Landing site
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Staff dashboard (dist snapshot)
    location = /dash { return 301 /dash/; }
    location /dash/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /dash/index.html;
    }

    # Citizen app
    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
    }

    # PocketBase realtime (long-lived SSE connection)
    location = /api/realtime {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # PocketBase API
    location /api/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # PocketBase admin UI
    location /_/ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # PocketBase SPA fallback (needed by the PB admin UI)
    location /__pb_fallback__ {
        proxy_pass http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
