# nginx config for the GamFix all-in-one Docker stack.
# Mirrors the production VPS layout; TLS terminates in front of this container.
server {
    listen 80;
    server_name _;
    # Docker embedded DNS; variables below make nginx tolerant of PocketBase
    # being temporarily unavailable at startup (instead of failing to boot).
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 20M;

    # UI path scheme (since 2026-11-12):
    #   /            landing (build in html/landing, vite base /landing/)
    #   /login /signup /home /report /track /profile /my-reports
    #   /verify/...  citizen app at ROOT paths (build in html/, vite base /)
    #   /dash/       staff dashboard snapshot
    # Legacy /app/* URLs redirect to their root equivalents.

    # Legacy /app paths from the pre-2026-11-12 layout
    rewrite ^/app/?$ /login permanent;
    rewrite ^/app/(.*)$ /$1 permanent;

    # Landing site at exactly "/"
    location = / {
        root /usr/share/nginx/html;
        try_files /landing/index.html =404;
    }
    location /landing/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # Citizen app: root paths, SPA fallback for client-side routes
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Staff dashboard (dist snapshot)
    location = /dash { return 301 /dash/; }
    location /dash/ {
        root /usr/share/nginx/html;
        try_files $uri /dash/index.html;
    }

    # PocketBase realtime (long-lived SSE connection)
    location = /api/realtime {
        set $pb_upstream "http://pocketbase:8090";
        proxy_pass $pb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # PocketBase API
    location /api/ {
        set $pb_upstream "http://pocketbase:8090";
        proxy_pass $pb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # PocketBase admin UI
    location /_/ {
        set $pb_upstream "http://pocketbase:8090";
        proxy_pass $pb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # PocketBase SPA fallback (needed by the PB admin UI)
    location /__pb_fallback__ {
        set $pb_upstream "http://pocketbase:8090";
        proxy_pass $pb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
