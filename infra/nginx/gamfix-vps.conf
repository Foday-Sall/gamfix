server {
    # backend.pocketsoftware.dev = Worker custom domain (proxied to this VPS
    # by the gamfix-api Cloudflare Worker; the Worker fetches with SNI for
    # sslip.io, so the existing cert covers the TLS leg). api.* is reserved:
    # a stale Cloudflare Tunnel record still points there.
    server_name 15.224.0.22.sslip.io backend.pocketsoftware.dev api.pocketsoftware.dev;
    client_max_body_size 20M;

    # --- security headers (audit 2026-11-12) ---------------------------------
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    # All bundles are external files (script-src 'self' is safe); inline
    # <style> is required by React/Leaflet; Google Fonts serve the landing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        root /opt/gamfix-pocket/landing;
        try_files $uri $uri/ /index.html;
    }
    location = /dash { return 301 /dash/; }
    location /dash/ {
        root /opt/gamfix-pocket;
        try_files $uri $uri/ /dash/index.html;
    }
    location /app/ {
        root /opt/gamfix-pocket;
        try_files $uri $uri/ /app/index.html;
    }
    location = /api/realtime {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
    location /_/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
    location /__pb_fallback__ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/15.224.0.22.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/15.224.0.22.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = 15.224.0.22.sslip.io) { return 301 https://$host$request_uri; }
    listen 80;
    listen [::]:80;
    server_name 15.224.0.22.sslip.io;
    return 404;
}
