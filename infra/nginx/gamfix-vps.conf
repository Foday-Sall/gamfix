# GamFix VPS nginx — final layout (no Cloudflare in the data path).
#
#   UI  -> gamfix-web docker container on 127.0.0.1:8088 (landing /,
#          citizen app at root paths /login /signup /home ..., dashboard /dash/)
#   API -> PocketBase (systemd) on 127.0.0.1:8090
#
# Hosts:
#   gamfix.pocketsoftware.dev  UI + same-origin /api (apps are built same-origin)
#                              — ALSO the Google OAuth origin (the Google client
#                              registers https://gamfix.pocketsoftware.dev and
#                              https://gamfix.pocketsoftware.dev/api/oauth2-redirect)
#   api.pocketsoftware.dev     API only (clean alias for mobile/external clients)
#   15.224.0.22.sslip.io       direct-to-VPS fallback domain (LE cert exists)
#
# backend.pocketsoftware.dev was retired 2026-11-12 (it was a Cloudflare
# Workers custom domain; the Worker is gone and no vhost serves it here).
# A temporary pocketsoftware.dev (bare) vhost from 2026-11-12 was removed
# the same day — the Google client ended up registered on the gamfix host.
#
# Certificates for the pocketsoftware.dev hosts live in
# /etc/nginx/snippets/gamfix-*-certs.conf — self-signed placeholders until
# certbot issues the real ones (see /opt/gamfix-src/cert-issue.sh + the
# gamfix-cert-issue.timer which retries until the DNS points here, then
# swaps the snippets and reloads).

client_max_body_size 20M;

# ---------------------------------------------------------------- UI vhost --
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gamfix.pocketsoftware.dev;

    include /etc/nginx/snippets/gamfix-gamfix-certs.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/gamfix-headers.conf;
    include /etc/nginx/snippets/gamfix-api.conf;

    # UI: docker container (landing /, citizen app at root, dashboard /dash/)
    location = /dash { return 301 /dash/; }
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------- API vhost ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.pocketsoftware.dev;

    include /etc/nginx/snippets/gamfix-api-certs.conf;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/gamfix-headers.conf;
    include /etc/nginx/snippets/gamfix-api.conf;

    location / {
        return 404;
    }
}

# ------------------------------------------- direct-to-VPS fallback vhost --
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 15.224.0.22.sslip.io;

    ssl_certificate /etc/letsencrypt/live/15.224.0.22.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/15.224.0.22.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/gamfix-headers.conf;
    include /etc/nginx/snippets/gamfix-api.conf;

    location = /dash { return 301 /dash/; }
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --------------------------------------------------- ACME + http redirect --
server {
    listen 80;
    listen [::]:80;
    server_name gamfix.pocketsoftware.dev api.pocketsoftware.dev 15.224.0.22.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
