# GamFix VPS nginx — final layout (no Cloudflare in the data path).
#
#   UI  -> gamfix-web docker container on 127.0.0.1:8088 (landing, /app/, /dash/)
#   API -> PocketBase (systemd) on 127.0.0.1:8090
#
# Hosts:
#   gamfix.pocketsoftware.dev  UI + same-origin /api (apps are built same-origin)
#   backend.pocketsoftware.dev API only (alias for the API)
#   15.224.0.22.sslip.io       direct-to-VPS fallback domain (cert already exists)

# --- shared: security headers + ACME webroot -------------------------------
# In a snippet so every server block gets identical headers (add_header is
# only inherited when the block sets none itself).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
# All bundles are external files (script-src 'self' is safe); inline <style>
# is required by React/Leaflet; Google Fonts serve the landing. Apps are
# same-origin now; backend.* is still allowed for the transition window.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://backend.pocketsoftware.dev wss://backend.pocketsoftware.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Let's Encrypt HTTP-01 webroot (certbot writes here; served on :80 and :443)
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}
